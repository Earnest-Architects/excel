<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel Viewer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f6b3a">
<style>
:root{--bg:#f3f4f2;--fg:#1c2220;--pn:#fff;--bd:#d6dbd7;--hd:#e8ece9;--ac:#0f6b3a;--mut:#6b7570}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--fg:#e4e9e6;--pn:#1c211f;--bd:#333b37;--hd:#262d2a;--ac:#3fb573;--mut:#8f9a94}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
h1{font-size:15px;margin:0 8px 0 0;color:var(--ac);font-weight:700}
#fn{color:var(--mut);max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
button,input{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{background:var(--hd)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#q{width:190px}#cnt{color:var(--mut);min-width:6ch}
main{flex:1;min-height:0;position:relative}
/* Area sheet selalu terang seperti Excel agar warna file tampil apa adanya */
#grid{position:absolute;inset:0;overflow:auto;background:#fff;color:#000;font:14.67px/18px Calibri,Carlito,"Segoe UI",sans-serif}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
td,th{padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
td{border-right:1px solid var(--gl,#d9d9d9);border-bottom:1px solid var(--gl,#d9d9d9);vertical-align:bottom}
table.ng{--gl:transparent}
th{background:#f0f0f0;color:#555;font-weight:400;text-align:center;border-right:1px solid #cfcfcf;border-bottom:1px solid #cfcfcf;height:24px}
thead th{position:sticky;top:0;z-index:4;font-weight:600}
thead th:first-child{left:0;z-index:5}
tbody th{position:sticky;left:0;z-index:3}
td.fz{background:#fff}
td.ov{overflow:visible;text-overflow:clip}
td.n{text-align:right}td.b{text-align:center}
td.hit{background:#ffe27a!important}td.cur{outline:2px solid var(--ac);outline-offset:-2px}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#drop h2{margin:0;font-size:22px}#drop p{margin:0;color:var(--mut);max-width:44ch}
body.drag #drop,body.drag #grid{outline:3px dashed var(--ac);outline-offset:-10px}
footer{display:flex;gap:4px;align-items:center;padding:4px 8px;background:var(--pn);border-top:1px solid var(--bd);overflow-x:auto}
footer button{border-radius:6px 6px 0 0;white-space:nowrap}
#st{margin-left:auto;color:var(--mut);white-space:nowrap;padding-left:12px}
.more{margin:10px}
[hidden]{display:none!important}
#ptitle{display:none}
@media print{
  header,footer,#drop,.more{display:none!important}
  html,body{height:auto;background:#fff;color:#000}
  body{display:block}
  main{position:static}
  #grid{position:static;overflow:visible}
  #ptitle{display:block;font-weight:700;margin:0 0 6px}
  thead{display:table-header-group}
  thead th,tbody th{position:static}
  td.hit{background:transparent!important}td.cur{outline:none}
  tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="cs"></style>
</head>
<body>
<header>
  <h1>Excel Viewer</h1>
  <button class="pri" id="open">Buka file</button>
  <span id="fn"></span><span id="warn" style="color:#c0392b"></span>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="Cari di sheet ini" aria-label="Cari" hidden>
  <span id="cnt"></span>
  <button id="fx" hidden title="Tampilkan rumus">Rumus</button>
  <button id="zo" hidden aria-label="Perkecil">−</button><button id="zi" hidden aria-label="Perbesar">+</button>
  <button id="csv" hidden>Ekspor CSV</button>
  <button id="prt" hidden title="Cetak sheet ini (Ctrl+P)">Cetak</button>
</header>
<main>
  <div id="drop">
    <h2>Seret file Excel ke sini</h2>
    <p>Mendukung .xlsx, .xlsm, .xlsb, .xls, .ods, dan .csv. Warna, font, dan border terbaca untuk .xlsx/.xlsm; warna isi sel terbaca untuk .xls. File dibaca di browser dan tidak diunggah ke mana pun.</p>
    <button class="pri" id="open2">Pilih file</button>
  </div>
  <div id="ptitle"></div>
  <div id="grid" hidden></div>
  <style id="pg"></style>
</main>
<footer id="tabs" hidden></footer>
<input type="file" id="file" accept=".xlsx,.xlsm,.xlsb,.xls,.ods,.csv,.tsv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let wb=null,cur=null,showF=false,limit=1000,zoom=1,hits=[],hi=-1,styles=null,THEME=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Warna & gaya (ExcelJS) ---------- */
const IDX='000000 FFFFFF FF0000 00FF00 0000FF FFFF00 FF00FF 00FFFF 000000 FFFFFF FF0000 00FF00 0000FF FFFF00 FF00FF 00FFFF 800000 008000 000080 808000 800080 008080 C0C0C0 808080 9999FF 993366 FFFFCC CCFFFF 660066 FF8080 0066CC CCCCFF 000080 FF00FF FFFF00 00FFFF 800080 800000 008080 0000FF 00CCFF CCFFFF CCFFCC FFFF99 99CCFF FF99CC CC99FF FFCC99 3366FF 33CCCC 99CC00 FFCC00 FF9900 FF6600 666699 969696 003366 339966 003300 333300 993300 993366 333399 333333 000000 FFFFFF'.split(' ');
const BW={thin:'1px solid',medium:'2px solid',thick:'3px solid',dashed:'1px dashed',dotted:'1px dotted',hair:'1px dotted',double:'3px double',mediumDashed:'2px dashed',dashDot:'1px dashed',mediumDashDot:'2px dashed',dashDotDot:'1px dashed',slantDashDot:'2px dashed',mediumDashDotDot:'2px dashed'};

function themeColors(xml){
  const def='FFFFFF 000000 E7E6E6 44546A 4472C4 ED7D31 A5A5A5 FFC000 5B9BD5 70AD47 0563C1 954F72'.split(' ');
  if(!xml)return def;
  const names=['lt1','dk1','lt2','dk2','accent1','accent2','accent3','accent4','accent5','accent6','hlink','folHlink'];
  return names.map((n,i)=>{const m=xml.match(new RegExp('<a:'+n+'>[\\s\\S]*?(?:srgbClr val="|lastClr=")([0-9A-Fa-f]{6})'));return m?m[1]:def[i]});
}
function tint(hex,t){
  const r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}
  l=t<0?l*(1+t):l*(1-t)+t;
  const hue=(p,q,x)=>{if(x<0)x+=1;if(x>1)x-=1;return x<1/6?p+(q-p)*6*x:x<.5?q:x<2/3?p+(q-p)*(2/3-x)*6:p};
  let R,G,B;
  if(!s)R=G=B=l;else{const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;R=hue(p,q,h+1/3);G=hue(p,q,h);B=hue(p,q,h-1/3)}
  return [R,G,B].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
}
function rgbOf(c){
  if(!c)return null;let hex=null;
  if(c.argb)hex=String(c.argb).slice(-6);
  else if(c.theme!=null)hex=THEME[c.theme];
  else if(c.indexed!=null)hex=IDX[c.indexed];
  if(!hex)return null;
  if(c.tint)hex=tint(hex,c.tint);
  return '#'+hex;
}
function cssOf(st){
  const o=[],f=st.font||{},a=st.alignment||{},bd=st.border||{};
  if(f.bold)o.push('font-weight:700');
  if(f.italic)o.push('font-style:italic');
  const td=[f.underline?'underline':'',f.strike?'line-through':''].filter(Boolean).join(' ');
  if(td)o.push('text-decoration:'+td);
  if(f.size)o.push('font-size:'+(f.size*4/3).toFixed(1)+'px');
  if(f.name)o.push(`font-family:"${String(f.name).replace(/"/g,'')}",Calibri,Carlito,"Segoe UI",sans-serif`);
  const fc=rgbOf(f.color);if(fc)o.push('color:'+fc);
  const fl=st.fill;
  if(fl&&fl.type==='pattern'&&fl.pattern==='solid'){const b=rgbOf(fl.fgColor);if(b)o.push('background:'+b)}
  const H={left:'left',center:'center',right:'right',justify:'justify',centerContinuous:'center',fill:'left'};
  if(H[a.horizontal])o.push('text-align:'+H[a.horizontal]);
  const V={top:'top',middle:'middle',center:'middle',bottom:'bottom'};
  if(V[a.vertical])o.push('vertical-align:'+V[a.vertical]);
  if(a.wrapText)o.push('white-space:normal;word-break:break-word;text-overflow:clip');
  if(a.indent)o.push('padding-left:'+(4+a.indent*9)+'px');
  ['top','left','bottom','right'].forEach(k=>{const b=bd[k];if(b&&BW[b.style])o.push(`border-${k}:${BW[b.style]} ${rgbOf(b.color)||'#000'}`)});
  return {css:o.join(';'),wrap:!!a.wrapText};
}
/* Baca gaya langsung dari XML xlsx (tanpa library tambahan selain JSZip) */
async function buildStyles(buf){
  if(!window.JSZip)throw new Error('JSZip gagal dimuat');
  const z=await JSZip.loadAsync(buf);
  const txt=async p=>{const f=z.file(p);return f?f.async('string'):null};
  const dom=async p=>{const t=await txt(p);return t?new DOMParser().parseFromString(t,'application/xml'):null};
  const A=(e,n)=>e?e.getAttribute(n):null;
  const K=(e,t)=>e?[...e.children].find(c=>c.localName===t):null;
  const on=e=>!!e&&A(e,'val')!=='0'&&A(e,'val')!=='false';
  const col=e=>e?{argb:A(e,'rgb'),theme:e.hasAttribute('theme')?+A(e,'theme'):null,indexed:e.hasAttribute('indexed')?+A(e,'indexed'):null,tint:+(A(e,'tint')||0)}:null;
  THEME=themeColors(await txt('xl/theme/theme1.xml'));
  const sx=await dom('xl/styles.xml');
  const kids=t=>[...((sx.getElementsByTagName(t)[0]||{children:[]}).children)];
  const fonts=kids('fonts').map(f=>({bold:on(K(f,'b')),italic:on(K(f,'i')),strike:on(K(f,'strike')),
    underline:!!K(f,'u')&&A(K(f,'u'),'val')!=='none',size:+A(K(f,'sz'),'val')||0,name:A(K(f,'name'),'val'),color:col(K(f,'color'))}));
  const fills=kids('fills').map(f=>{const p=K(f,'patternFill');return p?{type:'pattern',pattern:A(p,'patternType'),fgColor:col(K(p,'fgColor'))}:{}});
  const borders=kids('borders').map(b=>{const o={};
    ['left','right','top','bottom'].forEach(k=>{const e=K(b,k);if(e&&A(e,'style'))o[k]={style:A(e,'style'),color:col(K(e,'color'))}});return o});
  const xfs=kids('cellXfs').map(x=>{const a=K(x,'alignment');return{font:fonts[+A(x,'fontId')],fill:fills[+A(x,'fillId')],border:borders[+A(x,'borderId')],
    alignment:a?{horizontal:A(a,'horizontal'),vertical:A(a,'vertical'),wrapText:['1','true'].includes(A(a,'wrapText')),indent:+A(a,'indent')||0}:{}}});
  const wbx=await dom('xl/workbook.xml'),rl=await dom('xl/_rels/workbook.xml.rels'),rel={};
  [...rl.getElementsByTagName('Relationship')].forEach(r=>rel[A(r,'Id')]=A(r,'Target'));
  const ids=new Map(),rules=[],xc={},wrap=new Set(),res={};
  for(const sh of wbx.getElementsByTagName('sheet')){
    const rid=sh.getAttribute('r:id')||([...sh.attributes].find(a=>a.localName==='id')||{}).value;
    let tg=rel[rid];if(!tg)continue;tg=tg.startsWith('/')?tg.slice(1):'xl/'+tg;
    const d=await dom(tg);if(!d)continue;
    const m={},vw=d.getElementsByTagName('sheetView')[0],pn=d.getElementsByTagName('pane')[0],fp=d.getElementsByTagName('sheetFormatPr')[0];
    for(const c of d.getElementsByTagName('c')){
      const si=+A(c,'s');if(!si)continue;
      if(xc[si]===undefined){
        const o=cssOf(xfs[si]||{});
        if(!o.css)xc[si]=-1;else{let i=ids.get(o.css);if(i==null){i=ids.size;ids.set(o.css,i);rules.push(`td.s${i}{${o.css}}`)}xc[si]=i;if(o.wrap)wrap.add(i)}
      }
      if(xc[si]>=0){const a=XLSX.utils.decode_cell(A(c,'r'));m[a.r+','+a.c]=xc[si]}
    }
    const fz=pn&&A(pn,'state')==='frozen';
    res[A(sh,'name')]={m,wr:wrap,grid:!(vw&&['0','false'].includes(A(vw,'showGridLines'))),
      x:fz?(+A(pn,'xSplit')||0):0,y:fz?(+A(pn,'ySplit')||0):0,
      dw:fp&&A(fp,'defaultColWidth')?A(fp,'defaultColWidth')*7+5:64,dh:fp&&A(fp,'defaultRowHeight')?A(fp,'defaultRowHeight')*4/3:20};
  }
  $('#cs').textContent=rules.join('\n');
  return res;
}

/* ---------- Buka file ---------- */
async function openFile(f){
  let buf;
  try{
    buf=await f.arrayBuffer();
    wb=XLSX.read(buf,{cellDates:true,cellFormula:true,cellNF:true,cellStyles:true,sheetStubs:true});
  }catch(e){alert('File tidak bisa dibaca: '+e.message);return}
  styles=null;$('#cs').textContent='';$('#warn').textContent='';
  if(/\.(xlsx|xlsm)$/i.test(f.name)){
    try{styles=await buildStyles(buf)}
    catch(e){console.warn(e);$('#warn').textContent='Warna tidak terbaca: '+e.message}
  }
  $('#fn').textContent=f.name;document.title=f.name+' – Excel Viewer';
  $('#drop').hidden=true;$('#grid').hidden=false;$('#tabs').hidden=false;
  ['#q','#fx','#zo','#zi','#csv','#prt'].forEach(s=>$(s).hidden=false);
  const tabs=$('#tabs');tabs.innerHTML='';
  wb.SheetNames.forEach((n,i)=>{
    if((wb.Workbook?.Sheets?.[i]?.Hidden|0)>0)return;
    const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(n);tabs.append(b);
  });
  const st=document.createElement('span');st.id='st';tabs.append(st);
  show(wb.SheetNames.find((n,i)=>!(wb.Workbook?.Sheets?.[i]?.Hidden|0))||wb.SheetNames[0]);
}

function show(n){
  cur=n;limit=1000;$('#q').value='';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.textContent===n));
  render();
}

function render(){
  const ws=wb.Sheets[cur],box=$('#grid'),q=$('#q').value.trim().toLowerCase();
  if(!ws||!ws['!ref']){box.innerHTML='<p style="padding:20px;color:#888">Sheet ini kosong.</p>';$('#st').textContent='';return}
  const rg=XLSX.utils.decode_range(ws['!ref']),cols=ws['!cols']||[],rows=ws['!rows']||[];
  const S=styles&&styles[cur],sm=S?S.m:{},fzx=S?S.x:0,fzy=S?S.y:0,dw=S?S.dw:64,dh=S?S.dh:20;
  const cw=c=>{const k=cols[c];return (k&&(k.wpx||(k.wch&&k.wch*7+5)))||dw};
  const rh=r=>{const k=rows[r];return (k&&(k.hpx||(k.hpt&&k.hpt*4/3)))||dh};
  const skip=new Set(),span={};
  (ws['!merges']||[]).forEach(m=>{
    for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++)skip.add(r+','+c);
    span[m.s.r+','+m.s.c]=[m.e.r-m.s.r+1,m.e.c-m.s.c+1];
  });
  const end=q?rg.e.r:Math.min(rg.e.r,rg.s.r+limit-1);
  const vis=[];for(let c=rg.s.c;c<=rg.e.c;c++)if(!(cols[c]&&cols[c].hidden))vis.push(c);
  const left={};let la=52;for(const c of vis)if(c<fzx){left[c]=la;la+=cw(c)}
  let ta=24;
  let h=`<table class="${S&&!S.grid?'ng':''}"><colgroup><col style="width:52px">`;
  vis.forEach(c=>{h+=`<col style="width:${cw(c)}px">`});
  h+='</colgroup><thead><tr><th></th>'+vis.map(c=>`<th>${XLSX.utils.encode_col(c)}</th>`).join('')+'</tr></thead><tbody>';
  for(let r=rg.s.r;r<=end;r++){
    if(rows[r]&&rows[r].hidden)continue;
    const fr=r<fzy;let tp=0;if(fr){tp=ta;ta+=rh(r)}
    h+=`<tr style="height:${rh(r)}px"><th${fr?` style="top:${tp}px;z-index:3"`:''}>${r+1}</th>`;
    for(const c of vis){
      const key=r+','+c;if(skip.has(key)&&!span[key])continue;
      const cell=ws[XLSX.utils.encode_cell({r,c})];
      let t='';
      if(cell)t=(showF&&cell.f)?'='+cell.f:(cell.w!=null?cell.w:String(cell.v??''));
      const si=sm[key],fc=c<fzx;
      const nx=ws[XLSX.utils.encode_cell({r,c:c+1})];
      const ov=cell&&cell.t==='s'&&t&&c<rg.e.c&&!(nx&&nx.v!=null&&nx.v!=='')&&!(S&&S.wr.has(si))&&!span[key];
      const cls=[cell&&cell.t==='n'&&!(showF&&cell.f)?'n':'',cell&&cell.t==='b'?'b':'',
        q&&t.toLowerCase().includes(q)?'hit':'',ov?'ov':'',(fr||fc)?'fz':'',si!=null?'s'+si:''].filter(Boolean).join(' ');
      const xs=(!S&&cell&&cell.s&&cell.s.patternType==='solid'&&cell.s.fgColor&&cell.s.fgColor.rgb)?'background:#'+cell.s.fgColor.rgb:'';
      const stl=[];
      if(fr||fc){stl.push('position:sticky');if(fr)stl.push(`top:${tp}px`);if(fc)stl.push(`left:${left[c]}px`);stl.push(`z-index:${fr&&fc?2:1}`)}
      if(xs)stl.push(xs);
      const st=stl.length?` style="${stl.join(';')}"`:'';
      const sp=span[key]?` rowspan=${span[key][0]} colspan=${span[key][1]}`:'';
      h+=`<td${cls?` class="${cls}"`:''}${sp}${st}>${esc(t)}</td>`;
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(end<rg.e.r)h+=`<button class="more" onclick="limit+=2000;render()">Tampilkan 2.000 baris lagi (${(rg.e.r-end).toLocaleString('id')} tersisa)</button>`;
  box.innerHTML=h;box.style.zoom=zoom;
  $('#st').textContent=`${(rg.e.r-rg.s.r+1).toLocaleString('id')} baris × ${vis.length} kolom · ${Math.round(zoom*100)}%`;
  hits=[...box.querySelectorAll('td.hit')];hi=-1;
  $('#cnt').textContent=q?(hits.length+' cocok'):'';
}

function nextHit(){
  if(!hits.length)return;
  hits[hi]?.classList.remove('cur');hi=(hi+1)%hits.length;
  hits[hi].classList.add('cur');hits[hi].scrollIntoView({block:'center',inline:'center'});
  $('#cnt').textContent=`${hi+1}/${hits.length}`;
}

$('#open').onclick=$('#open2').onclick=()=>$('#file').click();
$('#file').onchange=e=>{if(e.target.files[0])openFile(e.target.files[0]);e.target.value=''};
$('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(render,250)};
$('#q').onkeydown=e=>{if(e.key==='Enter')nextHit()};
$('#fx').onclick=e=>{showF=!showF;e.target.classList.toggle('on',showF);render()};
$('#zi').onclick=()=>{zoom=Math.min(2,zoom+.1);render()};
$('#zo').onclick=()=>{zoom=Math.max(.5,zoom-.1);render()};
$('#csv').onclick=()=>{
  const csv='\ufeff'+XLSX.utils.sheet_to_csv(wb.Sheets[cur]);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=cur+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)openFile(f)});

// Cetak: muat semua baris (maks 20.000), skala otomatis agar lebar muat di kertas
$('#prt').onclick=()=>window.print();
addEventListener('beforeprint',()=>{
  const ws=wb&&wb.Sheets[cur];if(!ws||!ws['!ref'])return;
  $('#ptitle').textContent=$('#fn').textContent+' – '+cur;
  limit=20000;render();
  const w=[...document.querySelectorAll('#grid col')].reduce((a,c)=>a+parseFloat(c.style.width),0);
  const land=w>700;
  $('#pg').textContent='@page{size:A4 '+(land?'landscape':'portrait')+';margin:10mm}';
  $('#grid').style.zoom=Math.min(1,(land?1030:690)/w);
});
addEventListener('afterprint',()=>{if(!wb)return;limit=1000;render()});

// Buka file langsung dari Explorer setelah aplikasi ter-install
if('launchQueue' in window)launchQueue.setConsumer(async p=>{if(p.files.length)openFile(await p.files[0].getFile())});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
